services:
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    command: ['postgres', '-c', 'log_statement=all']
    ports:
      - 5435:5432
    environment:
      - POSTGRES_USER=blog_user
      - POSTGRES_PASSWORD=mYAw3s0meB!og
      - POSTGRES_DB=postgres
  mariadb:
    image: mariadb
    container_name: mariadb
    ports:
      - 3306:3306
    environment:
      - MARIADB_USER=blog_user
      - MARIADB_ROOT_PASSWORD=mYAw3s0meB!og
      - MARIADB_PASSWORD=mYAw3s0meB!og
      - MARIADB_DATABASE=mariadb
  mysql:
    image: mysql
    container_name: mysql
    ports:
      - 3307:3306
    environment:
      - MYSQL_USER=blog_user
      - MYSQL_ROOT_PASSWORD=mYAw3s0meB!og
      - MYSQL_PASSWORD=mYAw3s0meB!og
      - MYSQL_DATABASE=mysql
